<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 246" role="img" aria-labelledby="st sd">
  <title id="st">Four bays of one research spine.</title>
  <desc id="sd">Alloy: residual drift 0.0659 percent to 0.0175 percent, peak drift 1.79 percent to 3.40 percent, plus 620.9 kgCO2e, 1D isothermal. Surface: ribs minus 31.10 percent, thickness plus 25.74 percent, plus 15.03 percent with a mode-1 imperfection, elastic. Frame: median A1-A3 carbon minus 5.7 percent on 32 of 33 frames. Form: 79 of 84 seismic pairs within 5 percent.</desc>
  <style>
    .board { fill: #10151c; }
    .beam { fill: none; stroke: #314255; stroke-width: 3; stroke-linecap: round; }
    .hot { fill: none; stroke: #67e8f9; stroke-width: 3; stroke-linecap: round; }
    .col { stroke: #314255; stroke-width: 1.5; }
    .idx { fill: #67e8f9; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; letter-spacing: 1px; }
    .bay { fill: #f4f7fb; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; }
    .stat { fill: #f7fbff; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; }
    .body { fill: #aeb9c6; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .limit { fill: #e7c27a; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .bead { fill: #f4feff; }
    @keyframes run {
      0% { stroke-dashoffset: 1048; }
      100% { stroke-dashoffset: 0; }
    }
    .hot { stroke-dasharray: 70 980; animation: run 4.2s linear infinite; }
  </style>
  <rect class="board" width="1120" height="246" rx="20"/>
  <path class="beam" id="beam" d="M48 36 H1072"/>
  <path class="hot" d="M48 36 H1072"/>
  <path class="col" d="M48 36 V228 M318 36 V228 M588 36 V228 M858 36 V228 M1072 36 V228"/>
  <circle class="bead" r="4">
    <animateMotion dur="4.2s" repeatCount="indefinite">
      <mpath href="#beam"/>
    </animateMotion>
  </circle>
    <g>
      <text class="idx" x="36" y="78">01</text>
      <text class="bay" x="72" y="78">Alloy</text>
      <text class="stat" x="36" y="118">0.0659% → 0.0175%</text>
      <text class="body" x="36" y="146">residual drift</text>
      <text class="body" x="36" y="166">Peak 1.79% → 3.40%</text>
      <text class="body" x="36" y="186">+620.9 kgCO2e</text>
      <text class="limit" x="36" y="214">1D and isothermal</text>
    </g>
    <g>
      <text class="idx" x="306" y="78">02</text>
      <text class="bay" x="342" y="78">Surface</text>
      <text class="stat" x="306" y="118">−31.10%  /  +25.74%</text>
      <text class="body" x="306" y="146">ribs  /  thickness</text>
      <text class="body" x="306" y="166">+15.03% once dented</text>
      <text class="body" x="306" y="186">equal concrete volume</text>
      <text class="limit" x="306" y="214">elastic only</text>
    </g>
    <g>
      <text class="idx" x="576" y="78">03</text>
      <text class="bay" x="612" y="78">Frame</text>
      <text class="stat" x="576" y="118">−5.7% median</text>
      <text class="body" x="576" y="146">whole-building A1-A3</text>
      <text class="body" x="576" y="166">32 of 33 frames</text>
      <text class="body" x="576" y="186">5,184 designs, 287 tests</text>
      <text class="limit" x="576" y="214">the frame spends the saving</text>
    </g>
    <g>
      <text class="idx" x="846" y="78">04</text>
      <text class="bay" x="882" y="78">Form</text>
      <text class="stat" x="846" y="118">79 / 84 within 5%</text>
      <text class="body" x="846" y="146">seismic pairs</text>
      <text class="body" x="846" y="166">force density, two solvers</text>
      <text class="body" x="846" y="186">ShellForm and ShellLab</text>
      <text class="limit" x="846" y="214">buckling and thickness govern</text>
    </g>
  <rect width="1120" height="246" rx="20" fill="none" stroke="#2a3848"/>
</svg>
