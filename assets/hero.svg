  <text class="name" x="48" y="118">Syed Nafiz Reja Hasib</text>
  <text class="sub" x="48" y="162">Shells, superelastic alloys, and low-carbon seismic design</text>
  <text class="sub" x="48" y="196">Solvers written against tests, buckling checks, and carbon counts.</text>
