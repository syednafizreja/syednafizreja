        <path d="M 808.0 174.0 L 827.5 159.9 L 847.0 148.0 L 866.5 140.0 L 886.0 137.2 L 905.5 140.0 L 925.0 148.0 L 944.5 159.9 L 964.0 174.0"/>
        <path d="M 827.5 174.0 L 827.5 159.9 L 827.5 154.1 L 827.5 159.9 L 827.5 174.0"/>
        <path d="M 847.0 174.0 L 847.0 148.0 L 847.0 137.2 L 847.0 148.0 L 847.0 174.0"/>
