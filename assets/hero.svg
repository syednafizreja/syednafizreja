<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Syed Nafiz Reja Hasib. Mechanics, verification, and low-carbon design.</title>
  <desc id="desc">A perspective shell mesh with a travelling highlight, and a superelastic flag loop with a moving point.</desc>
  <defs>
    <radialGradient id="glow" cx="74%" cy="42%" r="36%">
      <stop offset="0" stop-color="#5ce1e6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5ce1e6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#132033" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1120" height="360" rx="16"/></clipPath>
  </defs>
  <style>
    .eye { fill: #5ce1e6; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 1.6px; }
    .head { fill: #f8fafc; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 600; }
    .sub { fill: #94a3b8; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .wire { fill: none; stroke: #7f9aab; stroke-width: 1.05; stroke-linejoin: round; }
    .ridge { fill: none; stroke: #e8fffe; stroke-width: 1.5; }
    .scan { fill: none; stroke: #5ce1e6; stroke-width: 2; stroke-linecap: round; }
    .loop { fill: none; stroke: #5ce1e6; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
    .hot { fill: none; stroke: #f8feff; stroke-width: 1.7; stroke-linecap: round; }
    .dot { fill: #f8feff; }
    .tick { fill: none; stroke: #1e293b; stroke-width: 1; }
    @keyframes pulse {
      0%, 100% { stroke-opacity: 0.28; }
      50% { stroke-opacity: 1; }
    }
    @keyframes sweep {
      0% { stroke-dashoffset: 360; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glide {
      0% { stroke-dashoffset: 220; }
      100% { stroke-dashoffset: 0; }
    }
    .wire { animation: pulse 4.2s ease-in-out infinite; }
    .scan { stroke-dasharray: 22 340; animation: sweep 3.6s linear infinite; }
    .hot { stroke-dasharray: 26 200; animation: glide 4.4s linear infinite; }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1120" height="360" fill="#070b14"/>
    <rect width="1120" height="360" fill="url(#grid)"/>
    <rect width="1120" height="360" fill="url(#glow)"/>
    <path class="tick" d="M24 24 H64 M24 24 V64 M1096 24 H1056 M1096 24 V64 M24 336 H64 M24 336 V296 M1096 336 H1056 M1096 336 V296"/>
    <text class="eye" x="40" y="78">HELLO, I'M SYED NAFIZ REJA HASIB</text>
    <text class="head" x="40" y="124">Mechanics, verification, and</text>
    <text class="head" x="40" y="162">low-carbon design in one workflow.</text>
    <text class="sub" x="40" y="206">Shells, superelastic NiTi, seismic carbon.</text>
