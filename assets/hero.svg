<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="t d">
  <title id="t">Syed Nafiz Reja Hasib. Computational structural mechanics.</title>
  <desc id="d">Animated shell mesh, a travelling highlight, and a NiTi hysteresis loop.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2330"/>
      <stop offset="0.55" stop-color="#10141b"/>
      <stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="38%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#243140"/>
    </pattern>
    <clipPath id="clip"><rect width="1120" height="360" rx="18"/></clipPath>
  </defs>
  <style>
    .panel { fill: url(#wash); }
    .tick { fill: #67e8f9; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 2.2px; }
    .name { fill: #f2f6fb; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 38px; font-weight: 600; }
    .sub { fill: #a9b4c2; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; }
    .quiet { fill: #6e7c8d; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .wire { fill: none; stroke: #8fb6c6; stroke-width: 1.05; stroke-linejoin: round; }
    .ridge { fill: none; stroke: #d7fbff; stroke-width: 1.7; stroke-linejoin: round; }
    .node { fill: #bff6ff; }
    .loop { fill: none; stroke: #67e8f9; stroke-width: 1.7; stroke-linecap: round; }
    .axis { stroke: #314052; stroke-width: 1; }
    .scan { fill: none; stroke: #e8fffb; stroke-width: 2.2; stroke-linecap: round; opacity: 0.85; }
    @keyframes breathe {
      0%, 100% { stroke-opacity: 0.28; }
      50% { stroke-opacity: 0.95; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes draw {
      0% { stroke-dashoffset: 280; opacity: 0.2; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes sweep {
      0% { stroke-dashoffset: 420; }
      100% { stroke-dashoffset: -420; }
    }
    .mesh { animation: float 7.5s ease-in-out infinite; }
    .wire { animation: breathe 3.8s ease-in-out infinite; }
    .node { animation: breathe 3.8s ease-in-out infinite; }
    .loop { stroke-dasharray: 280; animation: draw 5.8s ease-in-out infinite; }
    .scan { stroke-dasharray: 28 390; animation: sweep 4.8s linear infinite; }
  </style>
  <g clip-path="url(#clip)">
    <rect class="panel" width="1120" height="360"/>
    <rect width="1120" height="360" fill="url(#dots)"/>
    <rect width="1120" height="360" fill="url(#glow)"/>
    <text class="tick" x="48" y="64">COMPUTATIONAL STRUCTURAL MECHANICS</text>
    <text class="name" x="48" y="122">Syed Nafiz Reja Hasib</text>
    <text class="sub" x="48" y="164">Shells, superelastic alloys, and low-carbon seismic design</text>
    <text class="quiet" x="48" y="214">One spine: the alloy, the shell, the frame, the form.</text>
    <text class="quiet" x="48" y="238">Each result kept with the place it gives up.</text>
