<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">Syed Nafiz Reja Hasib. Computational structural mechanics.</title>
  <desc id="desc">Name and research line beside an animated thin-shell wireframe and a small NiTi hysteresis loop.</desc>
  <style>
    .panel { fill: #14181f; }
    .rule { stroke: #2a3340; stroke-width: 1; }
    .name { fill: #e7edf5; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 620; letter-spacing: -0.4px; }
    .sub { fill: #9aa6b5; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; letter-spacing: 0.2px; }
    .tick { fill: #67e8f9; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 1.4px; }
    .wire { fill: none; stroke: #8fb4c4; stroke-width: 1.15; stroke-linejoin: round; stroke-linecap: round; }
    .wire-hot { fill: none; stroke: #67e8f9; stroke-width: 1.35; }
    .node { fill: #67e8f9; }
    .loop { fill: none; stroke: #67e8f9; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .axis { stroke: #3d4a5c; stroke-width: 1; }
    @keyframes breathe {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes draw {
      0% { stroke-dashoffset: 220; }
      55% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    .wire { animation: breathe 5.6s ease-in-out infinite; }
    .node { animation: breathe 5.6s ease-in-out infinite; animation-delay: 0.4s; }
    .loop { stroke-dasharray: 220; animation: draw 6.4s ease-in-out infinite; }
  </style>
  <rect class="panel" width="1120" height="300" rx="18"/>
