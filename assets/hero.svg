<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="t d">
  <title id="t">Syed Nafiz Reja Hasib. Computational structural mechanics.</title>
  <desc id="d">Name and line of work on the left. A NiTi loop below the text. A two-bay frame on the right, diagrid in one bay and a thin shell clear of the roof in the other.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#1b2430"/>
    </pattern>
    <clipPath id="clip"><rect width="1120" height="440" rx="18"/></clipPath>
  </defs>
  <style>
    .kicker { fill: #7aa8b3; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 1.6px; }
    .name { fill: #eef2f6; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 600; }
    .sub { fill: #c3ced8; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; }
    .quiet { fill: #8d99a6; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .member { fill: none; stroke: #aeb9c4; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .brace { fill: none; stroke: #aeb9c4; stroke-width: 1.5; stroke-linecap: round; }
    .bracehot { fill: none; stroke: #d5dee6; stroke-width: 1.5; stroke-linecap: round; }
    .shell { fill: none; stroke: #e7eef4; stroke-width: 1.1; stroke-linejoin: round; }
    .loop { fill: none; stroke: #8f9ba6; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .loophot { fill: none; stroke: #d5dee6; stroke-width: 1.6; stroke-linecap: round; }
    @keyframes sway {
      0%, 100% { transform: rotate(-0.25deg); }
      50% { transform: rotate(0.25deg); }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 90; }
      100% { stroke-dashoffset: 0; }
    }
    .building { transform-origin: 790px 384px; transform-box: view-box; animation: sway 8s ease-in-out infinite; }
    .bracehot, .loophot { stroke-dasharray: 16 80; animation: flow 2.8s linear infinite; }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1120" height="440" fill="#101418"/>
    <rect width="1120" height="440" fill="url(#dots)"/>
    <text class="kicker" x="48" y="64">COMPUTATIONAL STRUCTURAL MECHANICS</text>
    <text class="name" x="48" y="116">Syed Nafiz Reja Hasib</text>
    <text class="sub" x="48" y="158">Shells, superelastic alloys,</text>
    <text class="sub" x="48" y="182">and low-carbon seismic design</text>
    <text class="quiet" x="48" y="226">The alloy goes into the frame.</text>
    <text class="quiet" x="48" y="248">The shell takes the floor.</text>
    <text class="quiet" x="64" y="286">NiTi cycle</text>
    <path id="loop" class="loop" d="M56 348 C120 348 140 304 178 304 C226 304 244 348 312 348 C244 348 226 396 178 396 C140 396 120 348 56 348"/>
    <path class="loophot" d="M56 348 C120 348 140 304 178 304 C226 304 244 348 312 348 C244 348 226 396 178 396 C140 396 120 348 56 348"/>
    <g class="building">
