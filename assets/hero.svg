<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="t d">
  <title id="t">Syed Nafiz Reja Hasib. Computational structural mechanics.</title>
  <desc id="d">A NiTi loop feeds a diagrid bay and a thin shell on a frame. The shell crossfades into a dented shape while the frame sways.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d28"/>
      <stop offset="1" stop-color="#0c1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="38%" r="32%">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#223044"/>
    </pattern>
    <clipPath id="clip"><rect width="1120" height="420" rx="20"/></clipPath>
  </defs>
  <style>
    .kicker { fill: #67e8f9; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; letter-spacing: 2.4px; }
    .name { fill: #f4f7fb; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 600; }
    .sub { fill: #c5d0dc; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 16px; }
    .quiet { fill: #7e8c9d; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .wire { fill: none; stroke: #9fd0de; stroke-width: 1.05; stroke-linejoin: round; }
    .dent { fill: none; stroke: #e7c27a; stroke-width: 1.05; stroke-linejoin: round; }
    .crown { fill: none; stroke: #f3feff; stroke-width: 1.6; }
    .member { fill: none; stroke: #d5dee8; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .brace { fill: none; stroke: #67e8f9; stroke-width: 1.5; stroke-linecap: round; }
    .ground { stroke: #2c3b4e; stroke-width: 1; }
    .loop { fill: none; stroke: #67e8f9; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .spine { fill: none; stroke: #67e8f9; stroke-width: 1.4; stroke-linecap: round; opacity: 0.85; }
    .bead { fill: #f4feff; }
    @keyframes sway {
      0%, 100% { transform: rotate(-0.45deg); }
      50% { transform: rotate(0.45deg); }
    }
    @keyframes swap {
      0%, 40% { opacity: 1; }
      55%, 88% { opacity: 0.08; }
      100% { opacity: 1; }
    }
    @keyframes draw {
      0% { stroke-dashoffset: 240; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flow {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes travel {
      0% { stroke-dashoffset: 520; }
      100% { stroke-dashoffset: 0; }
    }
    .building { transform-origin: 790px 352px; transform-box: view-box; animation: sway 6.4s ease-in-out infinite; }
    .perfect { animation: swap 7.2s ease-in-out infinite; }
    .imperfect { animation: swap 7.2s ease-in-out infinite reverse; }
    .loop { stroke-dasharray: 240; animation: draw 5.2s ease-in-out infinite; }
    .brace { stroke-dasharray: 8 10; animation: flow 1.6s linear infinite; }
    .spine { stroke-dasharray: 10 14; animation: travel 3.6s linear infinite; }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1120" height="420" fill="url(#wash)"/>
    <rect width="1120" height="420" fill="url(#dots)"/>
    <rect width="1120" height="420" fill="url(#glow)"/>
    <text class="kicker" x="44" y="68">COMPUTATIONAL STRUCTURAL MECHANICS</text>
    <text class="name" x="44" y="122">Syed Nafiz Reja Hasib</text>
    <text class="sub" x="44" y="164">Shells, superelastic alloys,</text>
    <text class="sub" x="44" y="188">and low-carbon seismic design</text>
    <text class="quiet" x="44" y="232">The alloy goes into the frame.</text>
    <text class="quiet" x="44" y="252">The shell takes the floor. The count is carbon.</text>
    <line class="ground" x1="48" y1="318" x2="250" y2="318"/>
    <path class="loop" id="loop" d="M64 318 C108 318 124 276 156 276 C196 276 208 318 246 318 C208 318 196 356 156 356 C124 356 108 318 64 318"/>
    <text class="quiet" x="64" y="272">NiTi, each cycle</text>
