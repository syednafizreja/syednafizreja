        <path d="M 944.5 174.0 L 944.5 159.9 L 944.5 154.1 L 944.5 159.9 L 944.5 174.0"/>
      </g>
    </g>
  </g>
  <rect width="1120" height="440" rx="18" fill="none" stroke="#24303c"/>
</svg>
