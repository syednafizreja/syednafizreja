    <path class="scan" d="M 640.0 172.0 L 676.4 150.0 L 712.7 129.8 L 749.1 113.1 L 785.5 101.0 L 821.8 94.8 L 858.2 94.8 L 894.5 101.0 L 930.9 113.1 L 967.3 129.8 L 1003.6 150.0 L 1040.0 172.0"/>
    <path id="flag" class="loop" d="M700 286 L748 232 L980 222 L980 268 L760 280 Z"/>
    <path class="hot" d="M700 286 L748 232 L980 222 L980 268 L760 280 Z"/>
    <circle class="dot" r="3.6">
      <animateMotion dur="4.4s" repeatCount="indefinite">
        <mpath href="#flag"/>
      </animateMotion>
    </circle>
  </g>
  <rect x="0.5" y="0.5" width="1119" height="359" rx="16" fill="none" stroke="#1e293b"/>
</svg>
