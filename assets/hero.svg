<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Syed Nafiz Reja Hasib. Mechanics, verification, and low-carbon design.</title>
  <desc id="desc">A two-bay frame. The left bay is a NiTi diagrid with a flag loop. The right bay carries a shell vault. Four studies take turns: residual drift 0.0659 percent to 0.0175 percent, ribs minus 31.10 percent, median carbon minus 5.7 percent, and 79 of 84 pairs within 5 percent.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 H0 V28" fill="none" stroke="#121a26" stroke-width="1"/>
    </pattern>
    <radialGradient id="lamp" cx="78%" cy="28%" r="40%">
      <stop offset="0" stop-color="#9fd8dc" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9fd8dc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="board"><rect width="1200" height="500" rx="18"/></clipPath>
    <clipPath id="stage"><rect x="548" y="28" width="620" height="444" rx="14"/></clipPath>
  </defs>
  <style>
    .eye { fill: #9fd8dc; font-family: "Segoe UI Mono", ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: 2.4px; }
    .name { fill: #f4f1ea; font-family: Georgia, Palatino, "Times New Roman", serif; font-size: 36px; }
    .head { fill: #f4f1ea; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; }
    .sub { fill: #93a0b0; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .result { fill: #93a0b0; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; }
    .pill { fill: #101820; stroke: #243246; }
    .pilltext { fill: #f4f1ea; font-family: "Segoe UI Mono", ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: 0.6px; text-anchor: middle; }
    .steel { fill: none; stroke: #7f93a3; stroke-width: 1.15; stroke-linejoin: round; }
    .brace { stroke-width: 1.35; }
    .member { fill: none; stroke: #c5d0d8; stroke-width: 2.15; stroke-linejoin: round; stroke-linecap: square; }
    .pin { fill: #101820; stroke: #7f93a3; stroke-width: 1; }
    .joint { fill: #d8f7f6; }
    .glint { fill: none; stroke: #d8f7f6; stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 18 160; animation: glide 5.6s linear infinite; }
    .ridge { fill: none; stroke: #9fd8dc; stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 16 220; animation: glide 4.8s linear infinite; }
    .node { fill: #9fd8dc; opacity: 0.45; animation: ripple 4.8s ease-in-out infinite; }
    .flag { fill: none; stroke: #9fd8dc; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .bead { fill: #d8f7f6; }
    .halo { fill: #9fd8dc; opacity: 0.28; }
    .tab { fill: #f4f1ea; font-family: "Segoe UI Mono", ui-monospace, Consolas, monospace; font-size: 11px; letter-spacing: 1.4px; }
    .tabrule { fill: none; stroke: #9fd8dc; stroke-width: 1.6; stroke-linecap: round; }
    .tick { fill: none; stroke: #314458; stroke-width: 1; }
    .phase { opacity: 0.38; }
    .p0 { animation: ph0 14s linear infinite; }
    .p1 { animation: ph1 14s linear infinite; }
    .p2 { animation: ph2 14s linear infinite; }
    .p3 { animation: ph3 14s linear infinite; }
    @keyframes glide { to { stroke-dashoffset: -178; } }
    @keyframes ripple {
      0%, 100% { opacity: 0.28; }
      50% { opacity: 1; }
    }
    @keyframes ph0 {
      0%, 20% { opacity: 1; }
      28%, 94% { opacity: 0.34; }
      100% { opacity: 1; }
    }
    @keyframes ph1 {
      0%, 22% { opacity: 0.34; }
      30%, 45% { opacity: 1; }
      53%, 100% { opacity: 0.34; }
    }
    @keyframes ph2 {
      0%, 47% { opacity: 0.34; }
      55%, 70% { opacity: 1; }
      78%, 100% { opacity: 0.34; }
    }
    @keyframes ph3 {
      0%, 72% { opacity: 0.34; }
      80%, 95% { opacity: 1; }
      100% { opacity: 0.34; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glint, .ridge, .node, .phase { animation: none; opacity: 1; }
    }
  </style>
