<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Syed Nafiz Reja Hasib. Mechanics, verification, and low-carbon design.</title>
  <desc id="desc">A thin-shell arch and a superelastic flag loop. A dot traces the loop.</desc>
  <style>
    .board { fill: #0b111b; }
    .edge { fill: none; stroke: #1e293b; stroke-width: 1; }
    .eye { fill: #5ce1e6; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 1.4px; }
    .head { fill: #f8fafc; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 600; }
    .sub { fill: #94a3b8; font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    .arch { fill: none; stroke: #94a3b8; stroke-width: 1.15; stroke-linejoin: round; stroke-linecap: round; }
    .loop { fill: none; stroke: #5ce1e6; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; opacity: 0.9; }
    .loophot { fill: none; stroke: #ecfeff; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
    .dot { fill: #ecfeff; }
    @keyframes breathe {
      0%, 100% { stroke-opacity: 0.35; }
      50% { stroke-opacity: 1; }
    }
    @keyframes glide {
      0% { stroke-dashoffset: 280; }
      100% { stroke-dashoffset: 0; }
    }
    .arch { animation: breathe 5.5s ease-in-out infinite; }
    .a2 { animation-delay: 0.4s; }
    .a3 { animation-delay: 0.8s; }
    .loophot { stroke-dasharray: 28 220; animation: glide 4.8s linear infinite; }
  </style>
  <rect class="board" width="900" height="220" rx="12"/>
  <rect class="edge" x="0.5" y="0.5" width="899" height="219" rx="12"/>
  <text class="eye" x="28" y="46">HELLO, I'M SYED NAFIZ REJA HASIB</text>
  <text class="head" x="28" y="84">Mechanics, verification, and</text>
  <text class="head" x="28" y="116">low-carbon design in one workflow.</text>
  <text class="sub" x="28" y="206">Computational Structural Mechanics  ·  Shells  ·  Superelastic NiTi  ·  Seismic Carbon</text>
  <path class="arch a1" d="M560 92 Q710 28 860 92"/>
  <path class="arch a2" d="M590 92 Q710 46 830 92"/>
  <path class="arch a3" d="M624 92 Q710 64 796 92"/>
  <path class="arch" d="M640 92 V70"/>
  <path class="arch" d="M690 92 V50"/>
  <path class="arch" d="M740 92 V50"/>
  <path class="arch" d="M790 92 V70"/>
  <path id="flag" class="loop" d="M575 178 L620 118 L830 110 L830 152 L640 164 Z"/>
  <path class="loophot" d="M575 178 L620 118 L830 110 L830 152 L640 164 Z"/>
  <circle class="dot" r="3.4">
    <animateMotion dur="4.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#flag"/>
    </animateMotion>
  </circle>
</svg>
