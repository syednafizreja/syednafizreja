name: Update Profile Art & Timeline

on:
  schedule:
    - cron: "17 6 * * *"  # Runs daily at 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh-contributions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements-ci.txt

      - name: Scrape public contribution calendar (Zero-Token)
        run: python scripts/fetch_contributions.py

      - name: Render contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render structural shell & profile cards
        run: |
          python scripts/make_shell_svg.py
          python scripts/make_info_card.py

      - name: Rebuild README and site data from profile.json
        run: python scripts/build_profile.py

      - name: Commit and push if art updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json data/site.json README.md contrib-heatmap.svg structural-shell.svg info-card.svg
          git commit -m "chore(art): refresh heatmap and vector structural assets [skip ci]" || echo "No changes to commit"
          git pull --rebase -X theirs origin main
          git push origin main