  <text x="796" y="228" font-size="12.5" font-weight="700" fill="#34d399">Carbon</text>
  <text x="796" y="245" font-size="10.5" fill="#94a3b8">Embodied carbon from</text>
  <text x="796" y="259" font-size="10.5" fill="#94a3b8">material to building</text>
